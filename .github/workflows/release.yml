name: release

# Publishing is not a gate. The licence lets anyone build this themselves; the
# published image is a convenience, and this workflow only records which digest
# a version refers to.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the release
      packages: read # resolves the digest the image workflow just pushed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A release whose tag disagrees with the version it names is a trap that
      # surfaces months later in a report about the wrong build.
      - name: Refuse a tag that does not match the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$version" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag and crate version agree: $version"

      # The image job runs on the same tag push. Waiting for its digest here
      # would couple two workflows through the API; naming the tag is enough
      # for a reader, and the digest is recorded where it is consumed -- in the
      # private deployment that pins it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IMAGE: ghcr.io/nddev-opennetwork/nremote-server
        run: |
          set -euo pipefail
          notes=$(mktemp)
          # The backticks and braces below are markdown and a Go template, not
          # command substitution and not an Actions expression.
          # shellcheck disable=SC2016
          {
            printf 'Container image: `%s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Pin it by digest before deploying:\n\n'
            printf '```bash\n'
            printf "docker buildx imagetools inspect %s:%s --format '{{.Manifest.Digest}}'\n" "$IMAGE" "$TAG"
            printf '```\n'
          } > "$notes"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --notes-file "$notes"
