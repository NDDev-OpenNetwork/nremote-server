# Six advisories are held here, each with the reason it is held and a date the
# reason expires. None of them is "we looked and it seemed fine": every entry
# either names the code path that does not exist, or names the work that would
# close it.
#
# Thirteen more were closed rather than held, by refreshing the lockfile and
# raising sqlx, tungstenite, flexi_logger, deadpool and users. Holding is the
# exception, not the routine.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-12-01
reason = """
Marvin attack in `rsa`, no patched release since 2023. Reaches the lockfile
through `sqlx-mysql`, which `sqlx-macros-core` depends on so the compile-time
query checker understands every driver. Only the `sqlite` feature is enabled,
so `cargo tree -i rsa -e normal` prints nothing and the crate is not linked.
The same reasoning and the same check are in .cargo/audit.toml.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2026-12-01
reason = """
`bincode` arrives through `dtls` under the `webrtc` feature of the shared
library. That feature is off by default and is not enabled by this server, so
the crate is in the lockfile and not in any build. `cargo tree -i bincode`
fails to resolve it for the host target, which is the check.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2021-0139"
ignoreUntil = 2026-12-01
reason = """
`ansi_term` is unmaintained. Its only path is `clap` 2, which is a direct
dependency here. Leaving it is a decision with a cost: clap 2 also pins `atty`
below. Removing both means porting the argument parser to clap 4, which is not
a version bump -- `args_from_usage` is gone, and `init_args` iterates
`matches.args` to turn every flag into an environment variable, which has no
direct equivalent. That port is real work on the CLI contract of a running
server, tracked in AGENTS.md, not a drive-by change. No known vulnerability,
only lack of maintenance.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2021-0145"
ignoreUntil = 2026-12-01
reason = """
`atty` potential unaligned read, through `clap` 2 as above. The unsound path is
the Windows console handle; this program is built and shipped for Linux only.
Closed by the same clap 4 port.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0375"
ignoreUntil = 2026-12-01
reason = "`atty` is unmaintained. Same crate, same path and same fix as RUSTSEC-2021-0145."

[[IgnoredVulns]]
id = "RUSTSEC-2021-0137"
ignoreUntil = 2026-12-01
reason = """
`sodiumoxide` is unmaintained. It is a direct dependency and it is the ed25519
signing this server's whole authentication rests on, so this is the one entry
that is not about an unused path. There is no known vulnerability -- the crate
is functioning and its libsodium bindings are stable -- and replacing the
signing primitive under a protocol that deployed clients already speak is a
migration with a compatibility test behind it, not a dependency bump. Tracked
in AGENTS.md.
"""
